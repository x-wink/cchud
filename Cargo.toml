[workspace]
resolver = "2"
members = ["crates/pet-state", "crates/pet-hook"]

# Rust 侧是 oxforge pet 桌宠的开源半边:pet-state 是状态文件契约(闭源的小兽本体经 git 依赖取它),
# pet-hook 适配 Claude Code / Codex 的钩子,与 state.js 同一口径、写同一个目录。
[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/x-wink/cchud"

[workspace.dependencies]
pet-state = { path = "crates/pet-state", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# preserve_order:setup 改写用户的 settings.json 时键序原样保留,不按字母重排别人的配置
serde_json = { version = "1", features = ["preserve_order"] }
