# Rust 侧(pet-state / pet-hook)的门禁与发布:push 跑测试;推 `pet-hook-v*` tag 出四平台二进制挂到 Release。
# Node 侧脚本没有构建步骤,不在这里。
name: pet-hook

on:
  push:
    branches: [main]
    paths: ["Cargo.*", "crates/**", ".github/workflows/pet-hook.yml"]
    tags: ["pet-hook-v*"]
  pull_request:
    paths: ["Cargo.*", "crates/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings

  release:
    if: startsWith(github.ref, 'refs/tags/pet-hook-v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: pet-hook-macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, asset: pet-hook-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: pet-hook-windows-x86_64.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: pet-hook-linux-x86_64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p pet-hook --release --locked --target ${{ matrix.target }}
      - name: 产物改成按平台命名
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/pet-hook
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
