# Rust 侧(pet-state / pet-hook)的门禁与发布:push 跑测试;推 `pet-hook-v*` tag 出四平台二进制挂到 Release。
# Node 与 Rust 用同一批夹具验事件语义,并验实际二进制的委托与安装。
name: pet-hook

on:
  push:
    branches: [main]
    paths: ["Cargo.*", "crates/**", "*.js", "tests/**", "tools/check-release.ps1", ".github/workflows/pet-hook.yml"]
    tags: ["pet-hook-v*"]
  pull_request:
    paths: ["Cargo.*", "crates/**", "*.js", "tests/**", "tools/check-release.ps1", ".github/workflows/pet-hook.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo build -p pet-hook --locked
      - run: node --test tests/hooks.test.js
        env:
          CCHUD_TEST_PET_HOOK: ${{ github.workspace }}/target/debug/pet-hook

  build:
    if: startsWith(github.ref, 'refs/tags/pet-hook-v')
    needs: test
    strategy:
      matrix:
        # x86_64 的 mac 也在 Apple Silicon 机器上交叉编:Intel 的 mac 机器档 GitHub 已经下线
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: pet-hook-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: pet-hook-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: pet-hook-windows-x86_64.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: pet-hook-linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p pet-hook --release --locked --target ${{ matrix.target }}
      - name: Windows 发行二进制冒烟
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-release.ps1 -Binary target/${{ matrix.target }}/release/pet-hook.exe
      - name: 产物改成按平台命名
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/pet-hook
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # 四份产物齐了才建 Release,而且只建草稿:人核对过产物再公开。各平台各自上传会并发建出几个草稿
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 校验和
        run: cd dist && sha256sum pet-hook-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
